<svg width="1200" height="627" viewBox="0 0 1200 627" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hyperfixer, layered verification pipeline for AI-agent code">
  <defs>
    <pattern id="gridMinor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#1E4E7E"/>
      <stop offset="1" stop-color="#14395F"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9FC3E8"/>
    </marker>
  </defs>

  <!-- blueprint sheet -->
  <rect width="1200" height="627" fill="url(#glow)"/>
  <rect width="1200" height="627" fill="url(#gridMinor)"/>
  <rect width="1200" height="627" fill="url(#gridMajor)"/>

  <!-- drawing frame -->
  <rect x="10" y="10" width="1180" height="607" stroke="#BFD7EF" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="22" y="22" width="1156" height="583" stroke="#BFD7EF" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- corner registration ticks -->
  <g stroke="#BFD7EF" stroke-opacity="0.7" stroke-width="1.5">
    <path d="M 22 52 v -30 h 30"/>
    <path d="M 1148 22 h 30 v 30"/>
    <path d="M 22 575 v 30 h 30"/>
    <path d="M 1178 575 v 30 h -30"/>
  </g>

  <g font-family="Menlo, 'Cascadia Code', Consolas, monospace">
    <!-- eyebrow -->
    <text x="64" y="80" font-size="13" letter-spacing="4" fill="#9FC3E8">VERIFICATION PIPELINE · FOR AI-AGENT CODE · SHEET 02</text>

    <!-- wordmark -->
    <text x="60" y="152" font-size="62" font-weight="700" letter-spacing="4" fill="#F2F7FC">HYPERFIXER</text>
    <line x1="64" y1="172" x2="540" y2="172" stroke="#BFD7EF" stroke-opacity="0.5" stroke-width="1"/>

    <!-- tagline -->
    <text x="64" y="206" font-size="20" fill="#DCEBFA">Make AI agents prove their code works.</text>
    <text x="64" y="234" font-size="13" letter-spacing="1" fill="#8FB6DF">7 layers · cost-ordered · fail-fast · machine-readable verdicts</text>

    <!-- 7-layer gate table -->
    <g>
      <rect x="64" y="262" width="472" height="300" fill="#0F2C4A" fill-opacity="0.55" stroke="#BFD7EF" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="84" y="290" font-size="12" letter-spacing="3" fill="#9FC3E8">LAYER</text>
      <text x="160" y="290" font-size="12" letter-spacing="3" fill="#9FC3E8">GATE</text>
      <text x="330" y="290" font-size="12" letter-spacing="3" fill="#9FC3E8">COST</text>
      <text x="488" y="290" font-size="12" letter-spacing="3" fill="#9FC3E8">PASS</text>
      <line x1="64" y1="300" x2="536" y2="300" stroke="#BFD7EF" stroke-opacity="0.7" stroke-width="1.5"/>

      <g font-size="15" fill="#F2F7FC">
        <text x="84" y="329" fill="#8FB6DF">L1</text><text x="160" y="329">lint</text>
        <text x="84" y="364" fill="#8FB6DF">L2</text><text x="160" y="364">typecheck</text>
        <text x="84" y="399" fill="#8FB6DF">L3</text><text x="160" y="399">typetest</text>
        <text x="84" y="434" fill="#8FB6DF">L4</text><text x="160" y="434">unit</text>
        <text x="84" y="469" fill="#8FB6DF">L5</text><text x="160" y="469">property</text>
        <text x="84" y="504" fill="#8FB6DF">L6</text><text x="160" y="504">parity</text>
        <text x="84" y="539" fill="#8FB6DF">L7</text><text x="160" y="539">mutation</text>
      </g>

      <!-- cost bars -->
      <g fill="#5E96CE">
        <rect x="330" y="319" width="8"   height="10"/>
        <rect x="330" y="354" width="16"  height="10"/>
        <rect x="330" y="389" width="30"  height="10"/>
        <rect x="330" y="424" width="45"  height="10"/>
        <rect x="330" y="459" width="60"  height="10"/>
        <rect x="330" y="494" width="90"  height="10"/>
        <rect x="330" y="529" width="140" height="10" fill="#7FB2E2"/>
      </g>

      <!-- row rules -->
      <g stroke="#BFD7EF" stroke-opacity="0.22" stroke-width="1">
        <line x1="64" y1="337" x2="536" y2="337"/>
        <line x1="64" y1="372" x2="536" y2="372"/>
        <line x1="64" y1="407" x2="536" y2="407"/>
        <line x1="64" y1="442" x2="536" y2="442"/>
        <line x1="64" y1="477" x2="536" y2="477"/>
        <line x1="64" y1="512" x2="536" y2="512"/>
      </g>

      <!-- checkmarks -->
      <g stroke="#7FE0A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 490 321 l 5 6 l 10 -12"/>
        <path d="M 490 356 l 5 6 l 10 -12"/>
        <path d="M 490 391 l 5 6 l 10 -12"/>
        <path d="M 490 426 l 5 6 l 10 -12"/>
        <path d="M 490 461 l 5 6 l 10 -12"/>
        <path d="M 490 496 l 5 6 l 10 -12"/>
        <path d="M 490 531 l 5 6 l 10 -12"/>
      </g>
    </g>

    <!-- agent loop -->
    <g>
      <rect x="620" y="86" width="516" height="176" stroke="#9FC3E8" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="5 4"/>
      <text x="640" y="116" font-size="12" letter-spacing="3" fill="#9FC3E8">NOTE, THE AGENT LOOP</text>

      <g stroke="#BFD7EF" stroke-opacity="0.8" stroke-width="1.2" fill="#0F2C4A" fill-opacity="0.55">
        <rect x="648"  y="138" width="60"  height="34"/>
        <rect x="742"  y="138" width="150" height="34"/>
        <rect x="926"  y="138" width="66"  height="34"/>
        <rect x="1026" y="138" width="56"  height="34"/>
      </g>
      <g font-size="14" fill="#F2F7FC" text-anchor="middle">
        <text x="678"  y="160">run</text>
        <text x="817"  y="160">verdict.json</text>
        <text x="959"  y="160">hint</text>
        <text x="1054" y="160">fix</text>
      </g>
      <g stroke="#9FC3E8" stroke-width="1.5" marker-end="url(#arrow)">
        <line x1="710"  y1="155" x2="736" y2="155"/>
        <line x1="894"  y1="155" x2="920" y2="155"/>
        <line x1="994"  y1="155" x2="1020" y2="155"/>
      </g>
      <path d="M 1054 174 v 32 h -376 v -28" stroke="#9FC3E8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <text x="866" y="238" font-size="12" letter-spacing="2" fill="#8FB6DF" text-anchor="middle">REPEAT UNTIL EXIT 0</text>
    </g>

    <!-- exit code contract -->
    <g>
      <rect x="620" y="286" width="516" height="150" fill="#0F2C4A" fill-opacity="0.55" stroke="#BFD7EF" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="640" y="314" font-size="12" letter-spacing="3" fill="#9FC3E8">EXIT CODE CONTRACT</text>
      <line x1="620" y1="326" x2="1136" y2="326" stroke="#BFD7EF" stroke-opacity="0.7" stroke-width="1.5"/>

      <g font-size="15" font-weight="700" text-anchor="middle">
        <rect x="640" y="340" width="28" height="24" rx="3" fill="#7FE0A8" fill-opacity="0.15" stroke="#7FE0A8" stroke-width="1.5"/>
        <text x="654" y="357" fill="#7FE0A8">0</text>
        <rect x="640" y="372" width="28" height="24" rx="3" fill="#FF5A3C" fill-opacity="0.15" stroke="#FF5A3C" stroke-width="1.5"/>
        <text x="654" y="389" fill="#FF5A3C">1</text>
        <rect x="640" y="404" width="28" height="24" rx="3" fill="#FFC857" fill-opacity="0.15" stroke="#FFC857" stroke-width="1.5"/>
        <text x="654" y="421" fill="#FFC857">2</text>
      </g>
      <g font-size="15" fill="#DCEBFA">
        <text x="684" y="357">verified, ship it</text>
        <text x="684" y="389">your code is wrong, read the hint</text>
        <text x="684" y="421">your setup is wrong, fix config not code</text>
      </g>
    </g>

    <!-- QC stamp -->
    <g transform="translate(880 505) rotate(-7)">
      <rect x="-172" y="-36" width="344" height="72" rx="8" stroke="#FF5A3C" stroke-width="3.5" fill="#14395F" fill-opacity="0.35"/>
      <rect x="-164" y="-28" width="328" height="56" rx="5" stroke="#FF5A3C" stroke-width="1.5"/>
      <text x="0" y="8" font-size="21" font-weight="700" letter-spacing="3" fill="#FF5A3C" text-anchor="middle">OK · ALL GATES PASSED</text>
    </g>

    <!-- footer -->
    <text x="64" y="590" font-size="12" letter-spacing="2" fill="#8FB6DF">ZERO RUNTIME DEPS · RUNS ON BUN, DENO, NODE.JS</text>
    <text x="1136" y="590" font-size="12" letter-spacing="2" fill="#8FB6DF" text-anchor="end">github.com/egeominotti/hyperfixer</text>
  </g>
</svg>
